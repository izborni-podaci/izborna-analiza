[project]
name = "izbori"
version = "0.1.0"
description = "Archive and party-neutral checks of Serbian election results published by RIK"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "jinja2>=3.1",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
izbori = "izbori.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/izbori"]

[tool.pytest.ini_options]
testpaths = ["tests"]
