# Build the site and publish it to GitHub Pages. Runs on every push to main by a person, and when the
# update workflow archived something new (its own pushes don't trigger workflows, so it starts this one).
# The build is incremental: see the cache steps below.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # a newer run waits for the current deploy instead of cutting it off

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The previous build and its fingerprints: only pages whose data changed are rendered again (on election
      # night that is the round being counted). Changed code or templates rebuild everything.
      - name: Restore the previous build
        uses: actions/cache/restore@v4
        with:
          path: |
            _site
            _site.state.json
          key: site-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-
      - name: Build
        run: |
          pip install uv && uv sync --frozen
          uv run izbori site --out _site --incremental
          du -sh --apparent-size _site
      - name: Keep this build for the next one
        uses: actions/cache/save@v4
        with:
          path: |
            _site
            _site.state.json
          key: site-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
