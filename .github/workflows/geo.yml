# Geo: municipal boundaries for the map on the Explore page, from OpenStreetMap (ODbL), joined to RIK's
# municipalities by the cadastre's municipality code that OpenStreetMap carries. Boundaries rarely change, so this
# runs only when started by hand; it commits data/geo/municipalities.json (or, with `settlements`, the settlements'
# boundaries at admin_level 9 into data/geo/settlements.json) and starts the pages workflow.
name: geo

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the boundaries"
        type: boolean
        default: true
      inspect:
        description: "Only list what the dataset of Kosovo's municipalities holds"
        type: boolean
        default: false
      kim:
        description: "Only add Kosovo and Metohija's municipalities, in RIK's division"
        type: boolean
        default: false
      settlements:
        description: "Only the settlements' boundaries (admin_level 9), into data/geo/settlements.json"
        type: boolean
        default: false

permissions:
  contents: write  # commit the boundaries
  actions: write   # start the pages workflow

concurrency:
  group: geo
  cancel-in-progress: false

jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install uv && uv sync --frozen
      - name: Fetch the boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          INSPECT: ${{ inputs.inspect }}
          KIM: ${{ inputs.kim }}
          SETTLEMENTS: ${{ inputs.settlements }}
        run: |
          if [ "$INSPECT" = "true" ]; then
            uv run --with "pyshp>=2.3" izbori geo --kim-inspect
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          [ "$KIM" = "true" ] && args+=(--kim)
          [ "$SETTLEMENTS" = "true" ] && args+=(--settlements)
          [ "$COMMIT" = "true" ] && args+=(--commit --push --dispatch-pages)
          uv run --with "shapely>=2.0" --with "pyshp>=2.3" izbori geo "${args[@]}"
