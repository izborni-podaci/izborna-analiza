# By hand: local elections from the municipalities' own documents (data/municipal_docs.json). Five modes:
# classify (what each document is, from its first page, into data/local_docs.json, committed), results (a
# municipality's report of local results read into a draft round under data/local/, committed), boards (a local
# round's polling board decisions read into its boards.json, committed), crops (the results section of the
# boards' minutes as images, a day's artifact, to be read by eye), or the probe (a
# municipality's documents of one kind, each logged with every word that isn't a word of the forms masked).
name: local

on:
  workflow_dispatch:
    inputs:
      classify:
        description: "Classify the documents of these municipalities (codes, comma-separated, or all)"
        default: ""
      code:
        description: "Probe: a municipality code (e.g. 80314 for Pančevo)"
        default: ""
      kind:
        description: "Probe: stations, boards or commission (empty: all); crops: the results section of the code's boards' minutes as images (a day's artifact). With results: boards reads that local round's board decisions"
        default: ""
      limit:
        description: "How many documents to log"
        default: "40"
      path_has:
        description: "Only documents whose address holds this (e.g. 2023/12); with kind boards (alternatives split by |), their roles are logged masked and nothing is kept"
        default: ""
      pages:
        description: "Probe: pages read per document"
        default: "2"
      chars:
        description: "Probe: characters of each masked layout logged"
        default: "1200"
      results:
        description: "Results: a municipality code whose local results report to read into a draft round (with kind boards: a local round id, e.g. L80314-20240602)"
        default: ""
      date:
        description: "Results: the local election's day (YYYY-MM-DD)"
        default: ""
      name:
        description: "Results: the municipality's name for the title, in Cyrillic (e.g. Панчево)"
        default: ""

permissions:
  contents: write

concurrency:
  group: local
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn poppler-utils >/dev/null
          pip install uv && uv sync --frozen
      - name: Classify
        if: ${{ inputs.classify != '' }}
        env:
          CLASSIFY: ${{ inputs.classify }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run izbori local --classify "$CLASSIFY" --budget 270 --commit --push
      - name: Boards
        if: ${{ inputs.results != '' && inputs.kind == 'boards' }}
        env:
          ROUND: ${{ inputs.results }}
          PATH_HAS: ${{ inputs.path_has }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run izbori local --boards "$ROUND" --path-has "$PATH_HAS" --commit --push
      - name: Results
        if: ${{ inputs.results != '' && inputs.kind != 'boards' }}
        env:
          RESULTS: ${{ inputs.results }}
          DATE: ${{ inputs.date }}
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run izbori local --results "$RESULTS" --date "$DATE" --name "$NAME" --commit --push
      - name: Crops
        if: ${{ inputs.code != '' && inputs.kind == 'crops' }}
        env:
          CODE: ${{ inputs.code }}
          PATH_HAS: ${{ inputs.path_has }}
        run: uv run izbori local --crops "$CODE" --path-has "$PATH_HAS" --out crops
      - name: Keep the crops for a day
        if: ${{ inputs.code != '' && inputs.kind == 'crops' }}
        uses: actions/upload-artifact@v4
        with:
          name: crops
          path: crops/
          retention-days: 1
      - name: Probe
        if: ${{ inputs.code != '' && inputs.kind != 'crops' }}
        env:
          CODE: ${{ inputs.code }}
          KIND: ${{ inputs.kind }}
          LIMIT: ${{ inputs.limit }}
          PATH_HAS: ${{ inputs.path_has }}
          PAGES: ${{ inputs.pages }}
          CHARS: ${{ inputs.chars }}
        run: uv run izbori local --probe "$CODE" --kind "$KIND" --limit "$LIMIT" --path-has "$PATH_HAS" --pages "$PAGES" --chars "$CHARS"
