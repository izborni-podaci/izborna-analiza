# By hand: local elections from the municipalities' own documents (data/municipal_docs.json). Six modes:
# classify (what each document is, from its first page, into data/local_docs.json, committed; in 8 parallel
# parts), results (a municipality's report of local results read into a draft round under data/local/,
# committed), boards (a local round's polling board decisions read into its boards.json, committed), crops (the
# results section of the boards' minutes as reading sheets of their number cells, on a temporary branch, to be
# read by eye), the overview (per municipality and local election, what its results and boards are in, logged), or
# the probe (a municipality's documents of one kind, each logged with every word that isn't a word of the forms
# masked).
name: local

on:
  workflow_dispatch:
    inputs:
      classify:
        description: "Classify the documents of these municipalities (codes, comma-separated, or all)"
        default: ""
      code:
        description: "Probe: a municipality code (e.g. 80314 for Pančevo)"
        default: ""
      kind:
        description: "Probe: stations, boards or commission (empty: all); crops: the results section of the code's boards' minutes as images (on a temporary branch, crops-tmp); pages: the documents whose link holds path_has as page images cut above their signatures, there too; crops-read deletes that branch; merge commits the classified parts of the run whose id is in code (one cancelled or cut short); overview logs, per municipality and local election, what its results and boards are in. With results: boards reads that local round's board decisions"
        default: ""
      limit:
        description: "How many documents to log"
        default: "40"
      path_has:
        description: "Only documents whose address holds this (e.g. 2023/12); with kind boards (alternatives split by |), their roles are logged masked and nothing is kept"
        default: ""
      pages:
        description: "Probe: pages read per document"
        default: "2"
      chars:
        description: "Probe: characters of each masked layout logged"
        default: "1200"
      results:
        description: "Results: municipality codes (comma-separated, one election day; day: every one with a report of date not yet published) whose local results reports to read into draft rounds (with kind boards: a local round id, e.g. L80314-20240602)"
        default: ""
      date:
        description: "Results: the local election's day (YYYY-MM-DD)"
        default: ""
      name:
        description: "Results: the municipality's name for the title, in Cyrillic (e.g. Панчево); empty, or several codes: the sites file's"
        default: ""

permissions:
  contents: write
  actions: read  # kind merge: another run's artifacts

# Runs that commit to main wait for each other; the crops commit nothing to main, so they have a queue of their own.
concurrency:
  group: ${{ (inputs.kind == 'crops' || inputs.kind == 'crops-read' || inputs.kind == 'pages') && 'local-crops' || 'local' }}
  cancel-in-progress: false

jobs:
  # Classifying reads every document's first page, so it is split over SHARDS runners by municipality (one
  # municipality's site still gets at most one runner's four requests at once); each part's store is kept as an
  # artifact and the merge job commits them together.
  classify:
    if: ${{ inputs.classify != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # as it is when the job starts: with what an earlier run committed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn poppler-utils antiword >/dev/null
          pip install uv && uv sync --frozen
      - name: Classify a part
        env:
          CLASSIFY: ${{ inputs.classify }}
          SHARD: ${{ matrix.shard }}
        run: uv run izbori local --classify "$CLASSIFY" --shard "$SHARD/8" --budget 320
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: classified-${{ matrix.shard }}
          path: data/local_docs.json
          retention-days: 2
          if-no-files-found: ignore

  # Also when the run is cancelled (every step: always()), so a part that hangs can be stopped without losing the
  # rest; kind merge with a run's id in code merges that run's parts.
  classify-merge:
    if: ${{ always() && (inputs.classify != '' || inputs.kind == 'merge') }}
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        if: ${{ always() }}
        with:
          ref: ${{ github.ref_name }}  # as it is when the job starts: with what an earlier run committed
      - uses: actions/setup-python@v5
        if: ${{ always() }}
        with:
          python-version: "3.12"
      - name: Install
        if: ${{ always() }}
        run: pip install uv && uv sync --frozen
      - uses: actions/download-artifact@v4
        if: ${{ always() }}
        with:
          pattern: classified-*
          path: parts
          run-id: ${{ inputs.kind == 'merge' && inputs.code || github.run_id }}
          github-token: ${{ github.token }}
      - name: Merge and commit
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run izbori local --merge-parts parts --commit --push

  probe:
    if: ${{ inputs.classify == '' && inputs.kind != 'merge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn poppler-utils antiword >/dev/null
          pip install uv && uv sync --frozen
      - name: Boards
        if: ${{ inputs.results != '' && inputs.kind == 'boards' }}
        env:
          ROUND: ${{ inputs.results }}
          PATH_HAS: ${{ inputs.path_has }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run izbori local --boards "$ROUND" --path-has "$PATH_HAS" --commit --push
      - name: Overview
        if: ${{ inputs.kind == 'overview' }}
        run: uv run izbori local --overview
      - name: Results
        if: ${{ inputs.results != '' && inputs.kind != 'boards' }}
        env:
          RESULTS: ${{ inputs.results }}
          DATE: ${{ inputs.date }}
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # OpenCV takes a scanned table's ruled lines out before OCR (boards.unruled)
          uv run --with "numpy>=1.26" --with "opencv-python-headless>=4.9" \
            izbori local --results "$RESULTS" --date "$DATE" --name "$NAME" --commit --push --out crops
      - name: Keep the report pages to read on a temporary branch
        # a draft that isn't ready (stations set aside, or sums that aren't the commission's totals) leaves its
        # report's pages, cut above the signatures, in crops/: they go where the crops go, deleted once read
        if: ${{ inputs.results != '' && inputs.kind != 'boards' }}
        run: |
          [ -d crops ] && [ -n "$(ls crops)" ] || exit 0
          git checkout -q --orphan crops-tmp
          git rm -rq --cached .
          git add -f crops/
          git commit -qm "Report pages to read by eye (temporary, deleted once read)"
          git push -qf origin HEAD:refs/heads/crops-tmp
      - name: Crops
        if: ${{ inputs.code != '' && (inputs.kind == 'crops' || inputs.kind == 'pages') }}
        env:
          CODE: ${{ inputs.code }}
          PATH_HAS: ${{ inputs.path_has }}
          KIND: ${{ inputs.kind }}
        # reading sheets: each station's number cells side by side with a digit model's guesses (izbori.sheet);
        # the crops of minutes whose cells aren't found go along whole. kind pages: the documents whose link holds
        # path_has, as page images cut above their signatures (a report's stations set aside, its lists' names)
        run: |
          if [ "$KIND" = pages ]; then
            uv run izbori local --report-pages "$CODE" --path-has "$PATH_HAS" --out crops
          else
            uv run --with "numpy>=1.26" --with "opencv-python-headless>=4.9" --with "scikit-learn>=1.4" \
              izbori local --crops "$CODE" --path-has "$PATH_HAS" --out crops --sheets
          fi
      - name: Keep the crops on a temporary branch
        # the run's artifacts are out of reach of the session that reads them; the branch is deleted once read
        if: ${{ inputs.code != '' && (inputs.kind == 'crops' || inputs.kind == 'pages') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan crops-tmp
          git rm -rq --cached .
          git add -f crops/
          git commit -qm "Crops of the boards' minutes' results section (temporary, deleted once read)"
          git push -qf origin HEAD:refs/heads/crops-tmp
      - name: Delete the crops' branch once read
        if: ${{ inputs.kind == 'crops-read' }}
        run: git push -q origin --delete crops-tmp || true
      - name: Probe
        if: ${{ inputs.code != '' && inputs.kind != 'crops' && inputs.kind != 'crops-read' && inputs.kind != 'pages' }}
        env:
          CODE: ${{ inputs.code }}
          KIND: ${{ inputs.kind }}
          LIMIT: ${{ inputs.limit }}
          PATH_HAS: ${{ inputs.path_has }}
          PAGES: ${{ inputs.pages }}
          CHARS: ${{ inputs.chars }}
        run: uv run izbori local --probe "$CODE" --kind "$KIND" --limit "$LIMIT" --path-has "$PATH_HAS" --pages "$PAGES" --chars "$CHARS"
