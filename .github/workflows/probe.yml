# Run by hand: can GitHub's servers reach RIK? Lists the rounds RIK offers and changes nothing.
name: probe

on:
  workflow_dispatch:
    inputs:
      register:
        description: "Also list what RIK's register of commissions' documents holds for local elections"
        type: boolean
        default: false
      reports:
        description: "With register: fetch each commission's total report and give its shape (pages, text layer, rows of figures)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List RIK's rounds
        run: |
          pip install uv && uv sync --frozen
          uv run izbori rounds
          if [ "${{ inputs.reports }}" = "true" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn poppler-utils >/dev/null
            uv run --with "numpy>=1.26" --with "opencv-python-headless>=4.9" izbori register --reports
          elif [ "${{ inputs.register }}" = "true" ]; then uv run izbori register; fi
