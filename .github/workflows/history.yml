# Run by hand: rebuild a finished round from RIK's results app, one polling station at a time, and archive it.
# Used for rounds whose CSV RIK no longer offers (parliamentary 2023: 341140 type 2, provincial 2023: 341143
# type 7, Belgrade 2024: 567956 type 3).
name: history

on:
  workflow_dispatch:
    inputs:
      round:
        description: "Round id"
        required: true
      type:
        description: "RIK election type (2 parliamentary, 3 local, 7 provincial)"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: history-${{ inputs.round }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install uv && uv sync --frozen
      - name: Rebuild and archive
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ inputs.round }}
          TYPE: ${{ inputs.type }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run izbori import-app --round "$ROUND" --type "$TYPE" --commit --push --dispatch-pages
